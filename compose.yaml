services:
  meshcore-tcp-mux:
    image: compumike/meshcore-tcp-mux:latest
    restart: unless-stopped
    command:
      - "--upstream-host"
      - "${MESHCORE_UPSTREAM_HOST:?Set MESHCORE_UPSTREAM_HOST to the companion hostname or IP}"
      - "--upstream-port"
      - "${MESHCORE_UPSTREAM_PORT:-5000}"
      - "--listen-host"
      - "0.0.0.0"
      - "--listen-multi-client-port"
      - "5001"
      - "--listen-dedicated-client-port"
      - "5002"
    # Local-only by default. Set MESHCORE_BIND_HOST to a trusted LAN address
    # deliberately; this native companion protocol has no authentication.
    ports:
      - "${MESHCORE_BIND_HOST:-127.0.0.1}:${MESHCORE_MULTI_CLIENT_PORT:-5001}:5001/tcp"
      - "${MESHCORE_BIND_HOST:-127.0.0.1}:${MESHCORE_DEDICATED_CLIENT_PORT:-5002}:5002/tcp"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
